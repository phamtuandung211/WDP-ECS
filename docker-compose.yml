version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: wdp-ecs-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: wdp-ecs
    volumes:
      - mongodb_data:/data/db
    networks:
      - wdp-network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: wdp-ecs-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin@mongodb:27017/wdp-ecs?authSource=admin
      JWT_SECRET: your_jwt_secret_key
      NODE_ENV: development
    depends_on:
      - mongodb
    volumes:
      - ./be:/app
      - /app/node_modules
    networks:
      - wdp-network

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: wdp-ecs-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./fe:/app
      - /app/node_modules
    networks:
      - wdp-network

volumes:
  mongodb_data:

networks:
  wdp-network:
    driver: bridge
